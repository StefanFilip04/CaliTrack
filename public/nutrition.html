<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDEE Calculator - CaliTrack</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/nutrition.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand"><a href="dashboard.html">CaliTrack</a></div>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="workouts.html" class="nav-link">Workouts</a>
            <a href="skills.html" class="nav-link">Skills</a>
            <a href="nutrition.html" class="nav-link active">Nutrition</a>
            <a href="about.html" class="nav-link">About</a>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </nav>

    <main class="container">
        <h1>TDEE Calculator</h1>
        <p class="subtitle">Calculate Maintenance Calories</p>

        <div class="tdee-card">
            <div class="input-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>Age (years)</label>
                    <input type="number" id="age" placeholder="0" value="0">
                </div>
                <div class="input-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" placeholder="0" value="0">
                </div>
                <div class="input-group">
                    <label>Height (cm)</label>
                    <input type="number" id="height" placeholder="0" value="0">
                </div>
            </div>

            <div class="input-group">
                <label>Activity Level</label>
                <select id="activity">
                    <option value="1.2">Sedentary (little or no exercise)</option>
                    <option value="1.375">Lightly active (1-3 days/week)</option>
                    <option value="1.55" selected>Moderately active (3-5 days/week)</option>
                    <option value="1.725">Very active (6-7 days/week)</option>
                    <option value="1.9">Super active (athlete/physical job)</option>
                </select>
            </div>

            <button onclick="calculateTDEE()" class="calculate-btn">Calculate TDEE</button>

            <div id="result" style="display: none; margin-top: 24px;"></div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/nutrition.js"></script>
</body>
</html>
